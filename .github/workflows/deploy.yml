name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng lint
      - run: npx ng test --watch=false
      # Pages serves the site from /<repository>/, so build with that base href.
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # Pages has no SPA fallback: serve the app for deep links such as /graj.
      - run: cp dist/tabliczka-mnozenia-game/browser/index.html dist/tabliczka-mnozenia-game/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/tabliczka-mnozenia-game/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
